version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: smart-city-postgres
    environment:
      POSTGRES_DB: smart_city_dw
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
